<!doctype html>
<html>
  <head>
    <title>Hydrating page</title>
  </head>
  <body>
    <main id="app">loading</main>
    <script>
      setTimeout(() => {
        document.getElementById("app").textContent = "intermediate";
      }, 100);
      setTimeout(() => {
        document.getElementById("app").textContent = "still-hydrating";
      }, 200);
      setTimeout(() => {
        document.body.className = "twelve-column-grid";
        document.getElementById("app").textContent = "final";
      }, 300);
    </script>
  </body>
</html>
